version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportsbook
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports: ['8123:8123', '9000:9000']
    volumes: [clickhouse_data:/var/lib/clickhouse]
    environment:
      CLICKHOUSE_DB: sportsbook_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ['9092:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Fix #23: use container hostname for internal, localhost for host access
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ['8080:8080']
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  grafana:
    image: grafana/grafana:10.4.0
    ports: ['3100:3000']
    volumes: [grafana_data:/var/lib/grafana]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  prometheus:
    image: prom/prometheus:v2.51.0
    ports: ['9090:9090']
    volumes: ['./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml']

  # ── Application Services ──────────────────────────────────────────────────

  gateway:
    build: ./services/gateway
    ports: ['4000:4000']
    environment:
      GATEWAY_PORT: 4000
      USER_SERVICE_URL: http://user-service:3001
      WALLET_SERVICE_URL: http://wallet-service:3002
      BETTING_ENGINE_URL: http://betting-engine:3003
      MARKET_SERVICE_URL: http://market-service:3004
      SETTLEMENT_ENGINE_URL: http://settlement-engine:3005
      CASINO_ENGINE_URL: http://casino-engine:3006
      ODDS_ENGINE_URL: http://odds-engine:3007
      RISK_ENGINE_URL: http://risk-engine:3008
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-refresh-secret}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
    depends_on: [redis]

  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/userdb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-refresh-secret}
      CORS_ORIGINS: http://localhost:3000
    depends_on: [postgres, redis, kafka]

  wallet-service:
    build: ./services/wallet-service
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/walletdb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-refresh-secret}
    depends_on: [postgres, redis, kafka]

  betting-engine:
    build: ./services/betting-engine
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bettingdb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-refresh-secret}
      WALLET_SERVICE_URL: http://wallet-service:3002
      MARKET_SERVICE_URL: http://market-service:3004
      RISK_ENGINE_URL: http://risk-engine:3008
    depends_on: [postgres, redis, kafka]

  market-service:
    build: ./services/market-service
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketdb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-refresh-secret}
    depends_on: [postgres, redis, kafka]

  settlement-engine:
    build: ./services/settlement-engine
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: settlement-engine
      BETTING_ENGINE_URL: http://betting-engine:3003
      WALLET_SERVICE_URL: http://wallet-service:3002
    depends_on: [kafka, betting-engine, wallet-service]

  casino-engine:
    build: ./services/casino-engine
    ports: ['3006:3006']
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/casinodb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-refresh-secret}
      WALLET_SERVICE_URL: http://wallet-service:3002
    depends_on: [postgres, redis, kafka, wallet-service]

  web:
    build: ./apps/web
    ports: ['3000:3000']
    environment:
      GATEWAY_URL: http://gateway:4000
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:3006/ws
      CASINO_WS_URL: ws://casino-engine:3006/ws
    depends_on: [gateway]

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  grafana_data:
