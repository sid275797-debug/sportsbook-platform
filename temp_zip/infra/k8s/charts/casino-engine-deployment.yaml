apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-engine
  labels: { app: casino-engine }
spec:
  replicas: 2
  selector:
    matchLabels: { app: casino-engine }
  template:
    metadata:
      labels: { app: casino-engine }
    spec:
      containers:
        - name: casino-engine
          image: {{ .Values.global.registry }}/casino-engine:{{ .Values.global.tag }}
          ports: [{ containerPort: 3006, name: http }, { containerPort: 3006, name: ws }]
          envFrom: [{ secretRef: { name: sportsbook-secrets } }, { configMapRef: { name: sportsbook-config } }]
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: casino-engine
spec:
  selector: { app: casino-engine }
  ports:
    - { name: http, port: 3006, targetPort: 3006 }
  type: ClusterIP
---
# HPA for casino engine — scales on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: casino-engine-hpa
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: casino-engine }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
