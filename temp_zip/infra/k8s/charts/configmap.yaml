apiVersion: v1
kind: ConfigMap
metadata:
  name: sportsbook-config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  KAFKA_BROKERS: "kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092"
  REDIS_URL: "redis://redis-cluster:6379"
  USER_SERVICE_URL: "http://user-service:3001"
  WALLET_SERVICE_URL: "http://wallet-service:3002"
  BETTING_ENGINE_URL: "http://betting-engine:3003"
  MARKET_SERVICE_URL: "http://market-service:3004"
  SETTLEMENT_ENGINE_URL: "http://settlement-engine:3005"
  CASINO_ENGINE_URL: "http://casino-engine:3006"
  ODDS_ENGINE_URL: "http://odds-engine:3007"
  RISK_ENGINE_URL: "http://risk-engine:3008"
