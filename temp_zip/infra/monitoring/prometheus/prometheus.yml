global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs: [{ targets: ['gateway:4000'] }]
  - job_name: 'user-service'
    static_configs: [{ targets: ['user-service:3001'] }]
  - job_name: 'wallet-service'
    static_configs: [{ targets: ['wallet-service:3002'] }]
  - job_name: 'betting-engine'
    static_configs: [{ targets: ['betting-engine:3003'] }]
  - job_name: 'market-service'
    static_configs: [{ targets: ['market-service:3004'] }]
  - job_name: 'casino-engine'
    static_configs: [{ targets: ['casino-engine:3006'] }]
  - job_name: 'odds-engine'
    static_configs: [{ targets: ['odds-engine:3007'] }]
  - job_name: 'risk-engine'
    static_configs: [{ targets: ['risk-engine:3008'] }]
  - job_name: 'kafka'
    static_configs: [{ targets: ['kafka:9092'] }]
  - job_name: 'postgres'
    static_configs: [{ targets: ['postgres:5432'] }]
  - job_name: 'redis'
    static_configs: [{ targets: ['redis:6379'] }]
