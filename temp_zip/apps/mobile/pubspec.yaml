name: sportsbook
description: Sportsbook betting app for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.1
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.4
  intl: ^0.19.0
  fl_chart: ^0.67.0
  cached_network_image: ^3.3.1
  firebase_messaging: ^14.7.14
  firebase_core: ^2.27.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
